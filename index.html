<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Alicerce Consultoria — Imóveis</title>
  <link rel="icon" href="favicon.ico" sizes="48x48">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="manifest" href="site.webmanifest">
  <meta name="theme-color" content="#f4f4f5">
  <meta name="description" content="Imóveis disponíveis — Alicerce Consultoria.">
  <!--
    WRAPPER ANTI /u/N/ — por que este arquivo existe
    -------------------------------------------------
    O web app do Apps Script é servido em script.google.com/macros/s/.../exec.
    Quando o visitante tem 2+ contas Google logadas, o Google redireciona a /exec
    para /u/1/, /u/2/... chuta o índice errado e mostra "Não foi possível abrir o
    arquivo". Carregando a MESMA /exec dentro de um <iframe> a partir de um domínio
    que NÃO é google.com, o Google entrega o app como sub-recurso e não roda esse
    roteador de conta — abre igual em qualquer navegador, com qualquer conta.

    Pré-requisitos (já feitos no app):
      - Implantação: "Executar como: Eu" + "Quem pode acessar: Qualquer pessoa".
      - doGet(): setXFrameOptionsMode(HtmlService.XFrameOptionsMode.ALLOWALL).

    COMO USAR:
      1. Cole a URL /exec completa em EXEC_URL abaixo.
      2. Hospede este arquivo em qualquer domínio fora do google.com
         (GitHub Pages, Netlify, ou o site da Alicerce).
      3. Compartilhe o link DESTA página — nunca mais a /exec direta.
  -->
  <style>
    :root { color-scheme: light dark; }
    html, body { margin: 0; height: 100%; background: #0f1115; }
    /* iframe ocupa o viewport inteiro, respeitando notch no mobile */
    #app {
      position: fixed; inset: 0; width: 100%; height: 100%;
      border: 0; display: block;
    }
    #fallback {
      position: fixed; inset: 0; display: none;
      align-items: center; justify-content: center; padding: 24px;
      font: 15px/1.5 system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      color: #e6e8eb; text-align: center;
    }
    #fallback a { color: #7aa2ff; }
    .loading {
      position: fixed; inset: 0; display: flex;
      align-items: center; justify-content: center;
      font: 14px system-ui, sans-serif; color: #8b94a3;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <div class="loading" id="loading">Carregando imóveis…</div>

  <!--
    COLE A URL /exec COMPLETA NO src ABAIXO.
    Ex.: https://script.google.com/macros/s/AKfycb..../exec
    Pode acrescentar ?page=produtos (vitrine), ?page=cadastro ou ?page=admin.
  -->
  <!--
    credentialless: carrega o iframe num contexto efêmero, SEM enviar os cookies
    de sessão do Google (igual a uma aba anônima). É isso que contorna o roteador
    de conta /u/N/ — com cookies, o Google tenta "adivinhar" a conta dentro do
    frame e quebra; sem cookies, serve anônimo e abre. Suportado em Chromium
    (Chrome/Edge 110+). Firefox/Safari ignoram o atributo (fallback: link direto).
  -->
  <iframe
    id="app"
    credentialless
    src="https://script.google.com/macros/s/AKfycbwQvFY39YnQ3Z9f3TfZYH55C90q9XhBNvIr0-_J4mlYZVPGx_oE0PQdCpBa7Ew1r-I5/exec"
    title="Alicerce Consultoria — Imóveis"
    allow="clipboard-write; clipboard-read; fullscreen"
    referrerpolicy="no-referrer"
    onload="document.getElementById('loading').style.display='none'"></iframe>

  <div id="fallback">
    <div>
      <p><strong>Não foi possível carregar.</strong></p>
      <p>Abra o link diretamente:
        <a id="directLink" href="https://script.google.com/macros/s/AKfycbwQvFY39YnQ3Z9f3TfZYH55C90q9XhBNvIr0-_J4mlYZVPGx_oE0PQdCpBa7Ew1r-I5/exec" target="_blank" rel="noopener">abrir o sistema</a>.
      </p>
    </div>
  </div>

  <script>
    // Se o iframe não sinalizar load em ~12s, oferece o link direto como rede de segurança.
    setTimeout(function () {
      var ld = document.getElementById('loading');
      if (ld && ld.style.display !== 'none') {
        ld.style.display = 'none';
        document.getElementById('fallback').style.display = 'flex';
      }
    }, 12000);
  </script>
  <script>
    /*
     * L-1 (O3, CONSELHO-015): a sessão do app mora AQUI, porque o iframe credentialless perde o
     * storage a cada recarga. Molde: gerenciador-analises/wrapper/analises-v3/index.html. Sem esta
     * página, ou com outro host, o app pede a senha (falha segura).
     */
    (function () {
      var CHAVE = 'imv-sessao';
      var app = document.getElementById('app');
      var TIPOS = { 'imv-sessao-get': 1, 'imv-sessao-set': 1 };
      /* o tipo conhecido; o valor, quando vem, é texto; o token gravado é o uuid do servidor */
      function noFormato(d) {
        if (!d || typeof d !== 'object' || !TIPOS[d.tipo]) return false;
        if (d.value !== undefined && typeof d.value !== 'string') return false;
        return !(d.tipo === 'imv-sessao-set' && d.value && !/^[0-9a-f]{8}(-[0-9a-f]{4}){3}-[0-9a-f]{12}$/i.test(d.value));
      }
      /* A página do app roda no host de script DESTE projeto (medido em 19/11 pela /exec e por este
         wrapper; V3-001 §14.18). O fim "5fhtazmluk2i" é igual ao do #13: o que separa os projetos é o
         começo. O número antes do "lu" fica aberto, como no #13 (não está medido se ele muda). */
      function doGoogle(origem) {
        return /^https:\/\/n-yewxj7bvxu6by7id2hbd4o3xwig5fhtazmluk2i-\d+lu-script\.googleusercontent\.com$/.test(origem);
      }
      /* e mora 2 frames abaixo do iframe: /exec -> painel -> página */
      function doIframe(w) {
        var p = w && w.parent;
        return !!p && p !== w && p.parent === app.contentWindow;
      }
      window.addEventListener('message', function (ev) {
        if (!doIframe(ev.source) || !doGoogle(ev.origin) || !noFormato(ev.data)) return;
        var d = ev.data;
        try {
          if (d.tipo === 'imv-sessao-get') {
            ev.source.postMessage({ tipo: 'imv-sessao-value', value: localStorage.getItem(CHAVE) || '' }, ev.origin);
          } else if (d.value) localStorage.setItem(CHAVE, d.value);
          else localStorage.removeItem(CHAVE);
        } catch (e) {
          /* sem armazenamento (aba anônima, bloqueio): o app pede a senha */
          if (d.tipo === 'imv-sessao-get') ev.source.postMessage({ tipo: 'imv-sessao-value', value: '' }, ev.origin);
        }
      });
    })();
  </script>
</body>
</html>
